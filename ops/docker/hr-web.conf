map $server_port $service_site {
    5181 absences;
    5182 trips;
    5183 hiring;
    5184 offboarding;
    5185 consents;
    5186 benefits;
    5187 documents;
    5188 events;
    5189 jira;
    5190 access;
    5191 confluence;
    5192 work-tools;
}

map $server_port $hr_api_host {
    5181 hr-absences:8181;
    5182 hr-trips:8182;
    5183 hr-hiring:8183;
    5184 hr-offboarding:8184;
    5185 hr-consents:8185;
    5186 hr-benefits:8186;
    5187 hr-documents:8187;
    5188 hr-events:8188;
    default "";
}

server {
    listen 5181;
    listen 5182;
    listen 5183;
    listen 5184;
    listen 5185;
    listen 5186;
    listen 5187;
    listen 5188;
    listen 5189;
    listen 5190;
    listen 5191;
    listen 5192;
    root /usr/share/nginx/html/$service_site;

    location /jira-api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $jira http://jira:8189;
        rewrite ^/jira-api/(.*)$ /api/$1 break;
        proxy_pass $jira$uri$is_args$args;
    }
    location ~ ^/api/v1/work-tools/(?<tool_slug>mattermost|redash|trino|trisigma|bitbucket|paas|grafana|tms|postman|test-stand|figma|design-system|design-review)(?:/demo/sessions)?$ {
        if ($service_site != work-tools) {
            return 404;
        }
        resolver 127.0.0.11 valid=5s ipv6=off;
        proxy_pass http://tool-$tool_slug:8200$request_uri;
    }
    location /work-tools/ {
        if ($service_site != work-tools) {
            return 404;
        }
        try_files $uri /index.html;
    }
    location /buddy-api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $buddy_api http://go:8080;
        rewrite ^/buddy-api/(.*)$ /api/$1 break;
        proxy_pass $buddy_api$uri$is_args$args;
    }
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $buddy http://go:8080;
        if ($service_site = access) {
            set $buddy http://access:8190;
        }
        if ($service_site = confluence) {
            set $buddy http://confluence:8191;
        }
        proxy_pass $buddy$request_uri;
    }
    location /hr-api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $hr_backend $hr_api_host;
        if ($hr_backend = "") {
            return 404;
        }
        rewrite ^/hr-api/(.*)$ /api/$1 break;
        proxy_pass http://$hr_backend$uri;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
