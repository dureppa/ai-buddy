name: ai-buddy

x-database-env: &database-env
  PGHOST: db
  PGPORT: "5432"
  PGUSER: aibuddy
  PGPASSWORD: ${COMPOSE_DB_PASSWORD:-local-aibuddy-secret}
  PGDATABASE: aibuddy

x-python: &python
  image: ai-buddy-python:local
  build:
    context: .
    dockerfile: docker/Dockerfile.python

x-hr: &hr
  profiles: [hr]
  healthcheck:
    test:
      - CMD-SHELL
      - wget -S -O /dev/null "http://127.0.0.1$$HTTP_ADDR$$HR_HEALTH_PATH" 2>&1 | grep -q 'HTTP/1.1 401'
    interval: 3s
    timeout: 3s
    retries: 20
  depends_on:
    db:
      condition: service_healthy

x-hr-env: &hr-env
  <<: *database-env
  PGADMIN_USER: aibuddy
  PGADMIN_PASSWORD: ${COMPOSE_DB_PASSWORD:-local-aibuddy-secret}
  SESSION_SECRET: ${COMPOSE_SESSION_SECRET:-local-demo-session-change-for-shared-host}
  TZ: Europe/Moscow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aibuddy
      POSTGRES_PASSWORD: ${COMPOSE_DB_PASSWORD:-local-aibuddy-secret}
      POSTGRES_DB: aibuddy
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aibuddy -d aibuddy"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: postgres:17-alpine
    environment: *database-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docker/migrate.sh:/migrate.sh:ro
      - ./services/backend-go/migrations:/migrations:ro
      - ./services/backend-go/seeds:/seeds:ro
    entrypoint: ["sh", "/migrate.sh"]

  go:
    build:
      context: .
      dockerfile: docker/Dockerfile.go
    environment:
      <<: *database-env
      DEMO_MODE: "true"
      AI_SERVICE_URL: http://agent:8001
      AI_SERVICE_TOKEN: ${COMPOSE_AI_TOKEN:-local-demo-flask-token}
      MCP_ADAPTER_SERVICE_TOKEN: ${COMPOSE_MCP_ADAPTER_TOKEN:-local-demo-adapter-token}
      AI_DELEGATION_SECRET: ${COMPOSE_DELEGATION_SECRET:-local-demo-delegation-change-for-shared-host}
      HR_ABSENCES_URL: http://hr-absences:8181
      HR_TRIPS_URL: http://hr-trips:8182
      HR_CONSENTS_URL: http://hr-consents:8185
      HR_CONSENTS_PUBLIC_URL: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5185/
      HR_DOCUMENTS_URL: http://hr-documents:8187
      HR_DOCUMENTS_PUBLIC_URL: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5187/
      HR_EVENTS_URL: http://hr-events:8188
      HR_EVENTS_PUBLIC_URL: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5188/
      SESSION_SECRET: ${COMPOSE_SESSION_SECRET:-local-demo-session-change-for-shared-host}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - wget -S -O /dev/null http://127.0.0.1:8080/api/v1/onboarding 2>&1 | grep -q 'HTTP/1.1 401'
      interval: 3s
      timeout: 3s
      retries: 15

  mcp:
    <<: *python
    network_mode: service:agent
    command: ["python", "-m", "ai_buddy.mcp_server"]
    environment:
      MCP_BACKEND: go_http
      GO_API_URL: http://go:8080
      MCP_ADAPTER_SERVICE_TOKEN: ${COMPOSE_MCP_ADAPTER_TOKEN:-local-demo-adapter-token}
    depends_on:
      agent:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent:
    <<: *python
    command: ["flask", "--app", "ai_buddy:create_app", "run", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      AI_AGENT_ENABLED: "true"
      AI_LLM_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI_SERVICE_TOKEN: ${COMPOSE_AI_TOKEN:-local-demo-flask-token}
      MCP_URL: http://127.0.0.1:8002/mcp
      AI_TURN_TIMEOUT: "25"
      AI_MODEL_TIMEOUT: "25"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: web
      args:
        PUBLIC_HR_ORIGIN: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}
    depends_on:
      go:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AI_BUDDY_WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 15

  hr-web:
    profiles: [hr]
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: hr-web
      args:
        PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://127.0.0.1:${AI_BUDDY_WEB_PORT:-5173}}
    ports:
      - "127.0.0.1:5181-5190:5181-5190"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5181/"]
      interval: 3s
      timeout: 3s
      retries: 15


  hr-absences:
    <<: *hr
    build:
      context: .
      dockerfile: docker/Dockerfile.go
      args:
        MODULE: services/hr/absences
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8181"
      HR_HEALTH_PATH: /api/v1/me/absence-summary
      PGUSER: hr_absences
      PGPASSWORD: ${COMPOSE_HR_DB_PASSWORD:-local-hr-secret}
      PGDATABASE: hr_absences
    ports:
      - "127.0.0.1:8181:8181"

  hr-trips:
    <<: *hr
    build:
      context: .
      dockerfile: docker/Dockerfile.go
      args:
        MODULE: services/hr/trips
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8182"
      HR_HEALTH_PATH: /api/v1/me/travel-summary
      PGUSER: hr_trips
      PGPASSWORD: ${COMPOSE_HR_DB_PASSWORD:-local-hr-secret}
      PGDATABASE: hr_trips
    ports:
      - "127.0.0.1:8182:8182"

  hr-hiring:
    <<: *hr
    build:
      context: .
      dockerfile: docker/Dockerfile.go
      args:
        MODULE: services/hr/hiring
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8183"
      HR_HEALTH_PATH: /api/v1/me/referral-summary
      PGUSER: hr_hiring
      PGPASSWORD: ${COMPOSE_HR_DB_PASSWORD:-local-hr-secret}
      PGDATABASE: hr_hiring
    ports:
      - "127.0.0.1:8183:8183"

  hr-offboarding:
    <<: *hr
    build:
      context: .
      dockerfile: docker/Dockerfile.go
      args:
        MODULE: services/hr/offboarding
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8184"
      HR_HEALTH_PATH: /api/v1/me/offboarding
      PGUSER: hr_offboarding
      PGPASSWORD: ${COMPOSE_HR_DB_PASSWORD:-local-hr-secret}
      PGDATABASE: hr_offboarding
    ports:
      - "127.0.0.1:8184:8184"

  hr-consents:
    <<: *hr
    build:
      context: .
      dockerfile: docker/Dockerfile.go
      args:
        MODULE: services/hr/consents
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8185"
      HR_HEALTH_PATH: /api/v1/me/consents
      PGUSER: hr_consents
      PGPASSWORD: ${COMPOSE_HR_DB_PASSWORD:-local-hr-secret}
      PGDATABASE: hr_consents
    ports:
      - "127.0.0.1:8185:8185"

  hr-benefits:
    <<: *hr
    build:
      context: .
      dockerfile: docker/Dockerfile.go
      args:
        MODULE: services/hr/benefits
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8186"
      HR_HEALTH_PATH: /api/v1/me/benefit-summary
      PGUSER: hr_benefits
      PGPASSWORD: ${COMPOSE_HR_DB_PASSWORD:-local-hr-secret}
      PGDATABASE: hr_benefits
    ports:
      - "127.0.0.1:8186:8186"

  hr-documents:
    <<: *hr
    build:
      context: .
      dockerfile: docker/Dockerfile.go
      args:
        MODULE: services/hr/documents
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8187"
      HR_HEALTH_PATH: /api/v1/me/documents
      PGUSER: hr_documents
      PGPASSWORD: ${COMPOSE_HR_DB_PASSWORD:-local-hr-secret}
      PGDATABASE: hr_documents
    ports:
      - "127.0.0.1:8187:8187"

  hr-events:
    <<: *hr
    build:
      context: .
      dockerfile: docker/Dockerfile.go
      args:
        MODULE: services/hr/events
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8188"
      HR_HEALTH_PATH: /api/v1/me/events
      PGUSER: hr_events
      PGPASSWORD: ${COMPOSE_HR_DB_PASSWORD:-local-hr-secret}
      PGDATABASE: hr_events
    ports:
      - "127.0.0.1:8188:8188"

  jira-db:
    profiles: [jira]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: ${COMPOSE_JIRA_DB_PASSWORD:-local-jira-secret}
      POSTGRES_DB: jira
    volumes:
      - jira-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U jira -d jira']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  jira-migrate:
    profiles: [jira]
    image: postgres:17-alpine
    environment:
      PGHOST: jira-db
      PGUSER: jira
      PGPASSWORD: ${COMPOSE_JIRA_DB_PASSWORD:-local-jira-secret}
      PGDATABASE: jira
    depends_on:
      jira-db:
        condition: service_healthy
    volumes:
      - ./docker/migrate.sh:/migrate.sh:ro
      - ./services/jira/migrations:/migrations:ro
      - ./services/jira/seeds:/seeds:ro
    entrypoint: ['sh', '/migrate.sh']

  jira:
    profiles: [jira]
    build:
      context: .
      dockerfile: docker/Dockerfile.go
      args:
        MODULE: services/jira
        ENTRY: .
    environment:
      PGHOST: jira-db
      PGUSER: jira
      PGPASSWORD: ${COMPOSE_JIRA_DB_PASSWORD:-local-jira-secret}
      PGDATABASE: jira
      JIRA_SESSION_SECRET: ${COMPOSE_JIRA_SESSION_SECRET:-local-jira-session-secret-change-for-shared-host}
      DEMO_MODE: 'true'
      HTTP_ADDR: ':8189'
    depends_on:
      jira-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8189/health']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  jira-postgres:
  postgres:
