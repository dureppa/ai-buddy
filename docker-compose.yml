name: ai-buddy

x-database-env: &database-env
  PGHOST: db
  PGPORT: "5432"
  PGUSER: aibuddy
  PGPASSWORD: ${COMPOSE_DB_PASSWORD:-local-aibuddy-secret}
  PGDATABASE: aibuddy

x-python: &python
  image: ai-buddy-python:local
  build:
    context: .
    dockerfile: ops/docker/Dockerfile.python

x-hr: &hr
  profiles: [hr]
  healthcheck:
    test:
      - CMD-SHELL
      - wget -S -O /dev/null "http://127.0.0.1$$HTTP_ADDR$$HR_HEALTH_PATH" 2>&1 | grep -q 'HTTP/1.1 401'
    interval: 3s
    timeout: 3s
    retries: 20
  depends_on:
    hr-databases:
      condition: service_completed_successfully

x-hr-env: &hr-env
  <<: *database-env
  DEMO_MODE: "true"
  SESSION_SECRET: ${COMPOSE_SESSION_SECRET:-local-demo-session-change-for-shared-host}
  TZ: Europe/Moscow

x-work-tool: &work-tool
  image: ${COMPOSE_PROJECT_NAME:-ai-buddy}-work-tool:local
  build:
    context: .
    dockerfile: ops/docker/Dockerfile.go
    args: { MODULE: tools, ENTRY: ./work-tool }
  depends_on:
    work-tool-migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/health"]
    interval: 3s
    timeout: 3s
    retries: 15

x-work-tool-env: &work-tool-env
  PGHOST: db
  HTTP_ADDR: ":8200"
  DEMO_MODE: "true"
  SESSION_SECRET: ${COMPOSE_WORK_TOOL_SESSION_SECRET:-local-work-tool-session-secret-change-me}
  TOOL_DELEGATION_SECRET: ${COMPOSE_WORK_TOOL_DELEGATION_SECRET:-local-work-tool-delegation-secret-change-me}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aibuddy
      POSTGRES_PASSWORD: ${COMPOSE_DB_PASSWORD:-local-aibuddy-secret}
      POSTGRES_DB: aibuddy
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aibuddy -d aibuddy"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: postgres:17-alpine
    environment: *database-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ops/docker/migrate.sh:/migrate.sh:ro
      - ./web/backend/migrations:/migrations:ro
      - ./web/backend/seeds:/seeds:ro
    entrypoint: ["sh", "/migrate.sh"]

  go:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.go
    environment:
      <<: *database-env
      DEMO_MODE: "true"
      JIRA_API_URL: ${JIRA_API_URL:-http://jira:8189}
      JIRA_PUBLIC_URL: ${JIRA_PUBLIC_URL:-${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5189}
      WORK_TOOLS_EXTERNAL: "true"
      WORK_TOOL_DELEGATION_SECRET: ${COMPOSE_WORK_TOOL_DELEGATION_SECRET:-local-work-tool-delegation-secret-change-me}
      WORK_TOOLS_PUBLIC_URL: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5192
      WORK_TOOLS_ENABLED: ${COMPOSE_WORK_TOOLS_ENABLED:-true}
      AI_SERVICE_URL: http://agent:8001
      AI_SERVICE_TOKEN: ${COMPOSE_AI_TOKEN:-local-demo-flask-token}
      MCP_ADAPTER_SERVICE_TOKEN: ${COMPOSE_MCP_ADAPTER_TOKEN:-local-demo-adapter-token}
      AI_DELEGATION_SECRET: ${COMPOSE_DELEGATION_SECRET:-local-demo-delegation-change-for-shared-host}
      ACCESS_API_URL: http://access:8190
      ACCESS_DELEGATION_SECRET: ${COMPOSE_ACCESS_DELEGATION_SECRET:-local-access-delegation-secret-change-me}
      ACCESS_PUBLIC_URL: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5190/
      CONFLUENCE_API_URL: http://confluence:8191
      CONFLUENCE_DELEGATION_SECRET: ${COMPOSE_CONFLUENCE_DELEGATION_SECRET:-local-confluence-delegation-secret-change-me}
      CONFLUENCE_PUBLIC_URL: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5191/
      HR_ABSENCES_URL: http://hr-absences:8181
      HR_TRIPS_URL: http://hr-trips:8182
      HR_HIRING_URL: http://hr-hiring:8183
      HR_HIRING_PUBLIC_URL: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5183/
      HR_OFFBOARDING_URL: http://hr-offboarding:8184
      HR_OFFBOARDING_PUBLIC_URL: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5184/
      HR_BENEFITS_URL: http://hr-benefits:8186
      HR_BENEFITS_PUBLIC_URL: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5186/
      JIRA_SESSION_SECRET: ${COMPOSE_JIRA_SESSION_SECRET:-local-jira-session-secret-change-for-shared-host}
      HR_CONSENTS_URL: http://hr-consents:8185
      HR_CONSENTS_PUBLIC_URL: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5185/
      HR_DOCUMENTS_URL: http://hr-documents:8187
      HR_DOCUMENTS_PUBLIC_URL: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5187/
      HR_EVENTS_URL: http://hr-events:8188
      HR_EVENTS_PUBLIC_URL: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}:5188/
      SESSION_SECRET: ${COMPOSE_SESSION_SECRET:-local-demo-session-change-for-shared-host}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - wget -S -O /dev/null http://127.0.0.1:8080/api/v1/onboarding 2>&1 | grep -q 'HTTP/1.1 401'
      interval: 3s
      timeout: 3s
      retries: 15

  mcp:
    <<: *python
    network_mode: service:agent
    command: ["python", "-m", "ai_buddy.mcp_server"]
    environment:
      MCP_BACKEND: go_http
      GO_API_URL: http://go:8080
      MCP_ADAPTER_SERVICE_TOKEN: ${COMPOSE_MCP_ADAPTER_TOKEN:-local-demo-adapter-token}
    depends_on:
      agent:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent:
    <<: *python
    command: ["flask", "--app", "ai_buddy:create_app", "run", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      AI_AGENT_ENABLED: "true"
      AI_LLM_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI_SERVICE_TOKEN: ${COMPOSE_AI_TOKEN:-local-demo-flask-token}
      MCP_URL: http://127.0.0.1:8002/mcp
      AI_TURN_TIMEOUT: "25"
      AI_MODEL_TIMEOUT: "25"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.web
      target: web
      args:
        PUBLIC_HR_ORIGIN: ${PUBLIC_HR_ORIGIN:-http://127.0.0.1}
    depends_on:
      go:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AI_BUDDY_WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 15

  hr-web:
    profiles: [hr]
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.web
      target: hr-web
      args:
        PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://127.0.0.1:${AI_BUDDY_WEB_PORT:-5173}}
    ports:
      - "127.0.0.1:5181-5192:5181-5192"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5181/"]
      interval: 3s
      timeout: 3s
      retries: 15


  hr-databases:
    image: postgres:17-alpine
    profiles: [hr]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database-env
      HR_ABSENCES_DB_PASSWORD: ${COMPOSE_HR_ABSENCES_DB_PASSWORD:-local-hr-absences-db-password}
      HR_TRIPS_DB_PASSWORD: ${COMPOSE_HR_TRIPS_DB_PASSWORD:-local-hr-trips-db-password}
      HR_HIRING_DB_PASSWORD: ${COMPOSE_HR_HIRING_DB_PASSWORD:-local-hr-hiring-db-password}
      HR_OFFBOARDING_DB_PASSWORD: ${COMPOSE_HR_OFFBOARDING_DB_PASSWORD:-local-hr-offboarding-db-password}
      HR_CONSENTS_DB_PASSWORD: ${COMPOSE_HR_CONSENTS_DB_PASSWORD:-local-hr-consents-db-password}
      HR_BENEFITS_DB_PASSWORD: ${COMPOSE_HR_BENEFITS_DB_PASSWORD:-local-hr-benefits-db-password}
      HR_DOCUMENTS_DB_PASSWORD: ${COMPOSE_HR_DOCUMENTS_DB_PASSWORD:-local-hr-documents-db-password}
      HR_EVENTS_DB_PASSWORD: ${COMPOSE_HR_EVENTS_DB_PASSWORD:-local-hr-events-db-password}
    volumes:
      - ./corporate-services/prepare-databases.sh:/prepare-hr.sh:ro
    entrypoint: [sh, /prepare-hr.sh]

  hr-absences:
    <<: *hr
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.go
      args:
        MODULE: corporate-services/absences
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8181"
      HR_HEALTH_PATH: /api/v1/me/absence-summary
      PGUSER: hr_absences
      PGPASSWORD: ${COMPOSE_HR_ABSENCES_DB_PASSWORD:-local-hr-absences-db-password}
      HR_DEMO_SIGNING_SECRET: ${COMPOSE_HR_ABSENCES_SESSION_SECRET:-local-hr-absences-session-secret-change-me}
      PGDATABASE: hr_absences
    ports:
      - "127.0.0.1:8181:8181"

  hr-trips:
    <<: *hr
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.go
      args:
        MODULE: corporate-services/trips
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8182"
      HR_HEALTH_PATH: /api/v1/me/travel-summary
      PGUSER: hr_trips
      PGPASSWORD: ${COMPOSE_HR_TRIPS_DB_PASSWORD:-local-hr-trips-db-password}
      HR_DEMO_SIGNING_SECRET: ${COMPOSE_HR_TRIPS_SESSION_SECRET:-local-hr-trips-session-secret-change-me}
      PGDATABASE: hr_trips
    ports:
      - "127.0.0.1:8182:8182"

  hr-hiring:
    <<: *hr
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.go
      args:
        MODULE: corporate-services/hiring
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8183"
      HR_HEALTH_PATH: /api/v1/me/referral-summary
      PGUSER: hr_hiring
      PGPASSWORD: ${COMPOSE_HR_HIRING_DB_PASSWORD:-local-hr-hiring-db-password}
      HR_DEMO_SIGNING_SECRET: ${COMPOSE_HR_HIRING_SESSION_SECRET:-local-hr-hiring-session-secret-change-me}
      PGDATABASE: hr_hiring
    ports:
      - "127.0.0.1:8183:8183"

  hr-offboarding:
    <<: *hr
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.go
      args:
        MODULE: corporate-services/offboarding
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8184"
      HR_HEALTH_PATH: /api/v1/me/offboarding
      PGUSER: hr_offboarding
      PGPASSWORD: ${COMPOSE_HR_OFFBOARDING_DB_PASSWORD:-local-hr-offboarding-db-password}
      HR_DEMO_SIGNING_SECRET: ${COMPOSE_HR_OFFBOARDING_SESSION_SECRET:-local-hr-offboarding-session-secret-change-me}
      PGDATABASE: hr_offboarding
    ports:
      - "127.0.0.1:8184:8184"

  hr-consents:
    <<: *hr
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.go
      args:
        MODULE: corporate-services/consents
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8185"
      HR_HEALTH_PATH: /api/v1/me/consents
      PGUSER: hr_consents
      PGPASSWORD: ${COMPOSE_HR_CONSENTS_DB_PASSWORD:-local-hr-consents-db-password}
      HR_DEMO_SIGNING_SECRET: ${COMPOSE_HR_CONSENTS_SESSION_SECRET:-local-hr-consents-session-secret-change-me}
      PGDATABASE: hr_consents
    ports:
      - "127.0.0.1:8185:8185"

  hr-benefits:
    <<: *hr
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.go
      args:
        MODULE: corporate-services/benefits
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8186"
      HR_HEALTH_PATH: /api/v1/me/benefit-summary
      PGUSER: hr_benefits
      PGPASSWORD: ${COMPOSE_HR_BENEFITS_DB_PASSWORD:-local-hr-benefits-db-password}
      HR_DEMO_SIGNING_SECRET: ${COMPOSE_HR_BENEFITS_SESSION_SECRET:-local-hr-benefits-session-secret-change-me}
      PGDATABASE: hr_benefits
    ports:
      - "127.0.0.1:8186:8186"

  hr-documents:
    <<: *hr
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.go
      args:
        MODULE: corporate-services/documents
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8187"
      HR_HEALTH_PATH: /api/v1/me/documents
      PGUSER: hr_documents
      PGPASSWORD: ${COMPOSE_HR_DOCUMENTS_DB_PASSWORD:-local-hr-documents-db-password}
      HR_DEMO_SIGNING_SECRET: ${COMPOSE_HR_DOCUMENTS_SESSION_SECRET:-local-hr-documents-session-secret-change-me}
      PGDATABASE: hr_documents
    ports:
      - "127.0.0.1:8187:8187"

  hr-events:
    <<: *hr
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.go
      args:
        MODULE: corporate-services/events
        ENTRY: .
    environment:
      <<: *hr-env
      HTTP_ADDR: ":8188"
      HR_HEALTH_PATH: /api/v1/me/events
      PGUSER: hr_events
      PGPASSWORD: ${COMPOSE_HR_EVENTS_DB_PASSWORD:-local-hr-events-db-password}
      HR_DEMO_SIGNING_SECRET: ${COMPOSE_HR_EVENTS_SESSION_SECRET:-local-hr-events-session-secret-change-me}
      PGDATABASE: hr_events
    ports:
      - "127.0.0.1:8188:8188"

  access-migrate:
    image: postgres:17-alpine
    environment:
      <<: *database-env
      ACCESS_DB_PASSWORD: ${COMPOSE_ACCESS_DB_PASSWORD:-local-access-db-password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./corporate-services/access:/data:ro
    entrypoint: [sh, /data/migrate.sh]

  access:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.access
    environment:
      PGHOST: db
      PGUSER: buddy_access
      PGDATABASE: buddy_access
      PGPASSWORD: ${COMPOSE_ACCESS_DB_PASSWORD:-local-access-db-password}
      HTTP_ADDR: ":8190"
      SESSION_SECRET: ${COMPOSE_ACCESS_SESSION_SECRET:-local-access-session-secret-change-me}
      ACCESS_DELEGATION_SECRET: ${COMPOSE_ACCESS_DELEGATION_SECRET:-local-access-delegation-secret-change-me}
      DEMO_MODE: "true"
    ports:
      - "127.0.0.1:8190:8190"
    depends_on:
      access-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8190/health"]
      interval: 3s
      timeout: 3s
      retries: 15

  confluence-migrate:
    image: postgres:17-alpine
    environment:
      <<: *database-env
      CONFLUENCE_DB_PASSWORD: ${COMPOSE_CONFLUENCE_DB_PASSWORD:-local-confluence-db-password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./tools/confluence/migrate.sh:/migrate-confluence.sh:ro
      - ./web/backend/internal/portal/pages.json:/data/confluence-pages.json:ro
    entrypoint: [sh, /migrate-confluence.sh]

  confluence:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.go
      args:
        MODULE: tools
        ENTRY: ./confluence
    environment:
      PGHOST: db
      PGUSER: buddy_confluence
      PGDATABASE: buddy_tool_confluence
      PGPASSWORD: ${COMPOSE_CONFLUENCE_DB_PASSWORD:-local-confluence-db-password}
      HTTP_ADDR: ":8191"
      SESSION_SECRET: ${COMPOSE_CONFLUENCE_SESSION_SECRET:-local-confluence-session-secret-change-me}
      CONFLUENCE_DELEGATION_SECRET: ${COMPOSE_CONFLUENCE_DELEGATION_SECRET:-local-confluence-delegation-secret-change-me}
      DEMO_MODE: "true"
    ports:
      - "127.0.0.1:8191:8191"
    depends_on:
      confluence-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8191/health"]
      interval: 3s
      timeout: 3s
      retries: 15

  work-tool-migrate:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database-env
      TOOL_MATTERMOST_DB_PASSWORD: ${COMPOSE_TOOL_MATTERMOST_DB_PASSWORD:-local-mattermost-db-password}
      TOOL_REDASH_DB_PASSWORD: ${COMPOSE_TOOL_REDASH_DB_PASSWORD:-local-redash-db-password}
      TOOL_TRINO_DB_PASSWORD: ${COMPOSE_TOOL_TRINO_DB_PASSWORD:-local-trino-db-password}
      TOOL_TRISIGMA_DB_PASSWORD: ${COMPOSE_TOOL_TRISIGMA_DB_PASSWORD:-local-trisigma-db-password}
      TOOL_BITBUCKET_DB_PASSWORD: ${COMPOSE_TOOL_BITBUCKET_DB_PASSWORD:-local-bitbucket-db-password}
      TOOL_PAAS_DB_PASSWORD: ${COMPOSE_TOOL_PAAS_DB_PASSWORD:-local-paas-db-password}
      TOOL_GRAFANA_DB_PASSWORD: ${COMPOSE_TOOL_GRAFANA_DB_PASSWORD:-local-grafana-db-password}
      TOOL_TMS_DB_PASSWORD: ${COMPOSE_TOOL_TMS_DB_PASSWORD:-local-tms-db-password}
      TOOL_POSTMAN_DB_PASSWORD: ${COMPOSE_TOOL_POSTMAN_DB_PASSWORD:-local-postman-db-password}
      TOOL_TEST_STAND_DB_PASSWORD: ${COMPOSE_TOOL_TEST_STAND_DB_PASSWORD:-local-test-stand-db-password}
      TOOL_FIGMA_DB_PASSWORD: ${COMPOSE_TOOL_FIGMA_DB_PASSWORD:-local-figma-db-password}
      TOOL_DESIGN_SYSTEM_DB_PASSWORD: ${COMPOSE_TOOL_DESIGN_SYSTEM_DB_PASSWORD:-local-design-system-db-password}
      TOOL_DESIGN_REVIEW_DB_PASSWORD: ${COMPOSE_TOOL_DESIGN_REVIEW_DB_PASSWORD:-local-design-review-db-password}
    volumes:
      - ./tools:/data:ro
    entrypoint: [sh, /data/work-tool/migrate.sh]

  tool-mattermost:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: mattermost
      PGUSER: buddy_tool_mattermost
      PGDATABASE: buddy_tool_mattermost
      PGPASSWORD: ${COMPOSE_TOOL_MATTERMOST_DB_PASSWORD:-local-mattermost-db-password}
    volumes:
      - ./tools/mattermost:/data/mattermost:ro

  tool-redash:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: redash
      PGUSER: buddy_tool_redash
      PGDATABASE: buddy_tool_redash
      PGPASSWORD: ${COMPOSE_TOOL_REDASH_DB_PASSWORD:-local-redash-db-password}
    volumes:
      - ./tools/redash:/data/redash:ro

  tool-trino:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: trino
      PGUSER: buddy_tool_trino
      PGDATABASE: buddy_tool_trino
      PGPASSWORD: ${COMPOSE_TOOL_TRINO_DB_PASSWORD:-local-trino-db-password}
    volumes:
      - ./tools/trino:/data/trino:ro

  tool-trisigma:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: trisigma
      PGUSER: buddy_tool_trisigma
      PGDATABASE: buddy_tool_trisigma
      PGPASSWORD: ${COMPOSE_TOOL_TRISIGMA_DB_PASSWORD:-local-trisigma-db-password}
    volumes:
      - ./tools/trisigma:/data/trisigma:ro

  tool-bitbucket:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: bitbucket
      PGUSER: buddy_tool_bitbucket
      PGDATABASE: buddy_tool_bitbucket
      PGPASSWORD: ${COMPOSE_TOOL_BITBUCKET_DB_PASSWORD:-local-bitbucket-db-password}
    volumes:
      - ./tools/bitbucket:/data/bitbucket:ro

  tool-paas:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: paas
      PGUSER: buddy_tool_paas
      PGDATABASE: buddy_tool_paas
      PGPASSWORD: ${COMPOSE_TOOL_PAAS_DB_PASSWORD:-local-paas-db-password}
    volumes:
      - ./tools/paas:/data/paas:ro

  tool-grafana:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: grafana
      PGUSER: buddy_tool_grafana
      PGDATABASE: buddy_tool_grafana
      PGPASSWORD: ${COMPOSE_TOOL_GRAFANA_DB_PASSWORD:-local-grafana-db-password}
    volumes:
      - ./tools/grafana:/data/grafana:ro

  tool-tms:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: tms
      PGUSER: buddy_tool_tms
      PGDATABASE: buddy_tool_tms
      PGPASSWORD: ${COMPOSE_TOOL_TMS_DB_PASSWORD:-local-tms-db-password}
    volumes:
      - ./tools/tms:/data/tms:ro

  tool-postman:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: postman
      PGUSER: buddy_tool_postman
      PGDATABASE: buddy_tool_postman
      PGPASSWORD: ${COMPOSE_TOOL_POSTMAN_DB_PASSWORD:-local-postman-db-password}
    volumes:
      - ./tools/postman:/data/postman:ro

  tool-test-stand:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: test-stand
      PGUSER: buddy_tool_test_stand
      PGDATABASE: buddy_tool_test_stand
      PGPASSWORD: ${COMPOSE_TOOL_TEST_STAND_DB_PASSWORD:-local-test-stand-db-password}
    volumes:
      - ./tools/test-stand:/data/test-stand:ro

  tool-figma:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: figma
      PGUSER: buddy_tool_figma
      PGDATABASE: buddy_tool_figma
      PGPASSWORD: ${COMPOSE_TOOL_FIGMA_DB_PASSWORD:-local-figma-db-password}
    volumes:
      - ./tools/figma:/data/figma:ro

  tool-design-system:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: design-system
      PGUSER: buddy_tool_design_system
      PGDATABASE: buddy_tool_design_system
      PGPASSWORD: ${COMPOSE_TOOL_DESIGN_SYSTEM_DB_PASSWORD:-local-design-system-db-password}
    volumes:
      - ./tools/design-system:/data/design-system:ro

  tool-design-review:
    <<: *work-tool
    environment:
      <<: *work-tool-env
      WORK_TOOL: design-review
      PGUSER: buddy_tool_design_review
      PGDATABASE: buddy_tool_design_review
      PGPASSWORD: ${COMPOSE_TOOL_DESIGN_REVIEW_DB_PASSWORD:-local-design-review-db-password}
    volumes:
      - ./tools/design-review:/data/design-review:ro

  jira-db:
    profiles: [jira]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: ${COMPOSE_JIRA_DB_PASSWORD:-local-jira-secret}
      POSTGRES_DB: jira
    volumes:
      - jira-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U jira -d jira']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  jira-migrate:
    profiles: [jira]
    image: postgres:17-alpine
    environment:
      PGHOST: jira-db
      PGUSER: jira
      PGPASSWORD: ${COMPOSE_JIRA_DB_PASSWORD:-local-jira-secret}
      PGDATABASE: jira
    depends_on:
      jira-db:
        condition: service_healthy
    volumes:
      - ./ops/docker/migrate.sh:/migrate.sh:ro
      - ./tools/jira/migrations:/migrations:ro
      - ./tools/jira/seeds:/seeds:ro
    entrypoint: ['sh', '/migrate.sh']

  jira:
    profiles: [jira]
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.go
      args:
        MODULE: tools/jira
        ENTRY: .
    environment:
      PGHOST: jira-db
      PGUSER: jira
      PGPASSWORD: ${COMPOSE_JIRA_DB_PASSWORD:-local-jira-secret}
      PGDATABASE: jira
      JIRA_SESSION_SECRET: ${COMPOSE_JIRA_SESSION_SECRET:-local-jira-session-secret-change-for-shared-host}
      DEMO_MODE: 'true'
      HTTP_ADDR: ':8189'
    depends_on:
      jira-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8189/health']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  jira-postgres:
  postgres:
