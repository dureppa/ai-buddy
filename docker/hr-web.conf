map $server_port $service_site {
    5181 absences;
    5182 trips;
    5183 hiring;
    5184 offboarding;
    5185 consents;
    5186 benefits;
}

server {
    listen 5181;
    listen 5182;
    listen 5183;
    listen 5184;
    listen 5185;
    listen 5186;
    root /usr/share/nginx/html/$service_site;

    location / {
        try_files $uri $uri/ =404;
    }
}
