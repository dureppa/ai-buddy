map $server_port $service_site {
    5181 absences;
    5182 trips;
    5183 hiring;
    5184 offboarding;
    5185 consents;
    5186 benefits;
}

server {
    listen 5181;
    listen 5182;
    listen 5183;
    listen 5184;
    listen 5185;
    listen 5186;
    root /usr/share/nginx/html/$service_site;

    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $buddy http://go:8080;
        proxy_pass $buddy$request_uri;
    }
    location /hr-api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $consents http://hr-consents:8185;
        rewrite ^/hr-api/(.*)$ /api/$1 break;
        proxy_pass $consents$uri;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
