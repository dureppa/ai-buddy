name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Verify required CI jobs and latest main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/attempts/$CI_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/ci-jobs.json"
          python3 scripts/deploy/check_ci.py "$RUNNER_TEMP/ci-jobs.json"
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$DEPLOY_SHA" ]; then
            echo "Current main has advanced; this deployment is skipped."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy verified source
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/deploy/send.sh
