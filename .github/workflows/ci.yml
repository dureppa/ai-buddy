name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec -- prettier --check web/frontend extension/frontend ops/service-sites/frontend ops/service-sites/sites.mjs corporate-services/*/frontend tools/*/frontend eslint.config.mjs prettier.config.mjs
      - run: npm exec -- eslint web/frontend extension/frontend ops/service-sites/frontend ops/service-sites/sites.mjs corporate-services/*/frontend tools/*/frontend
      - run: npm run typecheck --workspaces
      - run: npm run test:coverage --workspace=@ai-buddy/web
      - run: npm test --workspace=@ai-buddy/extension --workspace=@ai-buddy/corporate-services
      - uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage/lcov.info
          if-no-files-found: error
      - run: npm run build --workspaces

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ai-agent/.python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ai-agent/uv.lock
      - working-directory: ai-agent
        run: |
          uv sync --locked
          uv run --locked ruff format --check . ../ops/deploy
          uv run --locked ruff check . ../ops/deploy
          uv run --locked mypy . ../ops/deploy
          uv run --locked pytest --cov=. --cov=../ops/deploy --cov-report=term-missing --cov-fail-under=80

  go:
    name: go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: aibuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      JIRA_TEST_DATABASE_URL: postgres://postgres:integration-only@127.0.0.1:5432/aibuddy_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:integration-only@127.0.0.1:5432/aibuddy_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: web/backend/go.mod
          cache-dependency-path: web/backend/go.sum
      - run: |
          for migration in web/backend/migrations/*.up.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f web/backend/seeds/demo.sql
      - working-directory: corporate-services/access
        run: go test -race ./...
      - working-directory: tools
        run: go test -race ./...
      - working-directory: tools/jira
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - working-directory: corporate-services/consents
        run: go test -race ./...
      - working-directory: corporate-services/documents
        run: go test -race ./...
      - working-directory: corporate-services/events
        run: go test -race ./...
      - working-directory: web/backend
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted"
          go vet ./...
          go test ./...
          go test -race ./...
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Verify all external services without Buddy
        run: |
          sh ops/checks/external-services.sh
          sh ops/checks/check-access-migration.sh

  repository:
    name: repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: git diff --check HEAD^ HEAD
      - run: test -f README.md && test -f AGENTS.md && test -f justfile
      - run: test -f .github/pull_request_template.md && test -f .github/CODEOWNERS
      - run: for script in ops/deploy/*.sh; do bash -n "$script"; done
      - run: docker compose config --quiet && docker compose --profile hr --profile jira config --quiet && docker compose -f docker-compose.yml -f docker-compose.server.yml --profile hr --profile jira config --quiet
      - run: python3 -c "import re, subprocess; paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split(chr(0)); assert not any(re.search(r'(^|/)(dist|\.venv)/', p) for p in paths), 'Tracked build or environment artifacts'"
      - run: node -e "const fs=require('fs'); for (const p of ['package.json','package-lock.json','web/package.json','extension/package.json','ai-agent/pyproject.toml','web/backend/go.mod']) { if (!fs.existsSync(p)) throw new Error('Missing '+p) }"
