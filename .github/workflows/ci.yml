name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec -- prettier --check apps/web/frontend apps/extension/frontend apps/corporate-services/frontend apps/corporate-services/sites.mjs services/hr/*/frontend services/jira/frontend services/access/frontend services/confluence/frontend eslint.config.mjs prettier.config.mjs
      - run: npm exec -- eslint apps/web/frontend apps/extension/frontend apps/corporate-services/frontend apps/corporate-services/sites.mjs services/hr/*/frontend services/jira/frontend services/access/frontend services/confluence/frontend
      - run: npm run typecheck --workspaces
      - run: npm run test:coverage --workspace=@ai-buddy/web
      - run: npm test --workspace=@ai-buddy/extension --workspace=@ai-buddy/corporate-services
      - uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/lcov.info
          if-no-files-found: error
      - run: npm run build --workspaces

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: services/ai-python/.python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/ai-python/uv.lock
      - working-directory: services/ai-python
        run: |
          uv sync --locked
          uv run --locked ruff format --check . ../../scripts/deploy
          uv run --locked ruff check . ../../scripts/deploy
          uv run --locked mypy . ../../scripts/deploy
          uv run --locked pytest --cov=. --cov=../../scripts/deploy --cov-report=term-missing --cov-fail-under=80

  go:
    name: go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: aibuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      JIRA_TEST_DATABASE_URL: postgres://postgres:integration-only@127.0.0.1:5432/aibuddy_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:integration-only@127.0.0.1:5432/aibuddy_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/backend-go/go.mod
          cache-dependency-path: services/backend-go/go.sum
      - run: |
          for migration in services/backend-go/migrations/*.up.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f services/backend-go/seeds/demo.sql
      - working-directory: services/jira
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - working-directory: services/hr/consents
        run: go test -race ./...
      - working-directory: services/hr/documents
        run: go test -race ./...
      - working-directory: services/hr/events
        run: go test -race ./...
      - working-directory: services/backend-go
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted"
          go vet ./...
          go test ./...
          go test -race ./...
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

  repository:
    name: repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: git diff --check HEAD^ HEAD
      - run: test -f README.md && test -f AGENTS.md && test -f justfile
      - run: test -f .github/pull_request_template.md && test -f .github/CODEOWNERS
      - run: for script in scripts/deploy/*.sh; do bash -n "$script"; done
      - run: docker compose config --quiet && docker compose --profile hr --profile jira config --quiet && docker compose -f docker-compose.yml -f docker-compose.server.yml --profile hr --profile jira config --quiet
      - run: python3 -c "import re, subprocess; paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split(chr(0)); assert not any(re.search(r'(^|/)(dist|\.venv)/', p) for p in paths), 'Tracked build or environment artifacts'"
      - run: node -e "const fs=require('fs'); for (const p of ['package.json','package-lock.json','apps/web/package.json','apps/extension/package.json','services/ai-python/pyproject.toml','services/backend-go/go.mod']) { if (!fs.existsSync(p)) throw new Error('Missing '+p) }"
