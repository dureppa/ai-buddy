{
  'openapi': '3.0.3',
  'info':
    {
      'title': 'AI Buddy access portal',
      'version': '1.0.0',
      'description': 'Implemented Go/PostgreSQL API. Context is derived from authenticated profile. Explicit chat request authorizes submission for that turn. Approved does not grant actual target-system rights. Local demo sessions are not production authentication.',
    },
  'servers': [{ 'url': '/api/v1' }],
  'security': [{ 'bearerAuth': [] }],
  'paths':
    {
      '/portal-access/catalog':
        {
          'get':
            {
              'summary': 'Eligible templates, fixed resources and trusted profile',
              'responses':
                {
                  '200':
                    {
                      'description': 'Success',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Catalog' } } },
                    },
                  '400':
                    {
                      'description': 'Invalid input',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '401':
                    {
                      'description': 'Invalid or expired session',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '403':
                    {
                      'description': 'Role or product policy denied',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '404':
                    {
                      'description': 'Missing or inaccessible object',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '409':
                    {
                      'description': 'Stale decision or idempotency conflict',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '503':
                    {
                      'description': 'Storage unavailable',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                },
            },
        },
      '/portal-access/requests':
        {
          'get':
            {
              'summary': 'Own requests (latest 100)',
              'responses':
                {
                  '200':
                    {
                      'description': 'Success',
                      'content':
                        {
                          'application/json':
                            { 'schema': { 'type': 'array', 'items': { '$ref': '#/components/schemas/Request' } } },
                        },
                    },
                  '400':
                    {
                      'description': 'Invalid input',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '401':
                    {
                      'description': 'Invalid or expired session',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '403':
                    {
                      'description': 'Role or product policy denied',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '404':
                    {
                      'description': 'Missing or inaccessible object',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '409':
                    {
                      'description': 'Stale decision or idempotency conflict',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '503':
                    {
                      'description': 'Storage unavailable',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                },
            },
          'post':
            {
              'summary': 'Submit or return an existing active request',
              'responses':
                {
                  '200':
                    {
                      'description': 'Success',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Request' } } },
                    },
                  '400':
                    {
                      'description': 'Invalid input',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '401':
                    {
                      'description': 'Invalid or expired session',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '403':
                    {
                      'description': 'Role or product policy denied',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '404':
                    {
                      'description': 'Missing or inaccessible object',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '409':
                    {
                      'description': 'Stale decision or idempotency conflict',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '503':
                    {
                      'description': 'Storage unavailable',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                },
              'requestBody':
                {
                  'required': true,
                  'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/RequestInput' } } },
                },
              'parameters':
                [
                  {
                    'name': 'Idempotency-Key',
                    'in': 'header',
                    'required': true,
                    'schema': { 'type': 'string', 'minLength': 1, 'maxLength': 128 },
                  },
                ],
            },
        },
      '/portal-access/requests/{id}/decision':
        {
          'post':
            {
              'summary': 'Owner cancels a submitted request',
              'responses':
                {
                  '200':
                    {
                      'description': 'Success',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Request' } } },
                    },
                  '400':
                    {
                      'description': 'Invalid input',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '401':
                    {
                      'description': 'Invalid or expired session',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '403':
                    {
                      'description': 'Role or product policy denied',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '404':
                    {
                      'description': 'Missing or inaccessible object',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '409':
                    {
                      'description': 'Stale decision or idempotency conflict',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                  '503':
                    {
                      'description': 'Storage unavailable',
                      'content': { 'application/json': { 'schema': { '$ref': '#/components/schemas/Error' } } },
                    },
                },
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'required': ['action', 'note'],
                              'properties':
                                {
                                  'action': { 'type': 'string', 'enum': ['cancelled'] },
                                  'note':
                                    {
                                      'type': 'string',
                                      'maxLength': 2000,
                                      'description': 'Optional cancellation comment (empty string allowed)',
                                    },
                                },
                            },
                        },
                    },
                },
              'parameters':
                [{ 'name': 'id', 'in': 'path', 'required': true, 'schema': { 'type': 'string', 'format': 'uuid' } }],
            },
        },
    },
  'components':
    {
      'securitySchemes': { 'bearerAuth': { 'type': 'http', 'scheme': 'bearer' } },
      'schemas':
        {
          'Error':
            {
              'type': 'object',
              'required': ['code'],
              'properties':
                {
                  'code':
                    {
                      'type': 'string',
                      'enum': ['invalid_input', 'unauthenticated', 'forbidden', 'not_found', 'conflict', 'unavailable'],
                    },
                },
            },
          'RequestInput':
            {
              'type': 'object',
              'additionalProperties': false,
              'required':
                [
                  'template_id',
                  'catalog_version',
                  'system',
                  'resource_key',
                  'justification',
                  'permission',
                  'duration_days',
                  'fields',
                ],
              'properties':
                {
                  'template_id': { 'type': 'string' },
                  'catalog_version': { 'type': 'integer', 'enum': [1] },
                  'system': { 'type': 'string', 'minLength': 1, 'maxLength': 120 },
                  'resource_key': { 'type': 'string', 'minLength': 1, 'maxLength': 160 },
                  'justification': { 'type': 'string', 'minLength': 10, 'maxLength': 2000 },
                  'permission': { 'type': 'string', 'enum': ['read', 'write', 'admin'] },
                  'duration_days': { 'type': 'integer', 'minimum': 1, 'maximum': 90 },
                  'fields': { 'type': 'object', 'additionalProperties': { 'type': 'string', 'maxLength': 500 } },
                },
            },
          'Request':
            {
              'type': 'object',
              'required':
                [
                  'id',
                  'number',
                  'profile_id',
                  'product_id',
                  'input',
                  'status',
                  'origin',
                  'created_at',
                  'decision_by',
                  'decision_note',
                  'decided_at',
                ],
              'properties':
                {
                  'id': { 'type': 'string', 'format': 'uuid' },
                  'number': { 'type': 'string' },
                  'profile_id': { 'type': 'string' },
                  'product_id': { 'type': 'string' },
                  'input': { '$ref': '#/components/schemas/RequestInput' },
                  'status': { 'type': 'string', 'enum': ['submitted', 'approved', 'rejected', 'cancelled'] },
                  'origin': { 'type': 'string', 'enum': ['portal', 'agent'] },
                  'created_at': { 'type': 'string', 'format': 'date-time' },
                  'decision_by': { 'type': 'string', 'nullable': true },
                  'decision_note': { 'type': 'string' },
                  'decided_at': { 'type': 'string', 'nullable': true, 'format': 'date-time' },
                },
            },
          'Field':
            {
              'type': 'object',
              'required': ['key', 'label'],
              'properties':
                {
                  'key': { 'type': 'string' },
                  'label': { 'type': 'string' },
                  'options': { 'type': 'array', 'items': { 'type': 'string' } },
                  'placeholder': { 'type': 'string' },
                },
            },
          'Resource':
            {
              'type': 'object',
              'required': ['resource_key', 'fields'],
              'properties':
                {
                  'resource_key': { 'type': 'string' },
                  'fields': { 'type': 'object', 'additionalProperties': { 'type': 'string' } },
                },
            },
          'Template':
            {
              'type': 'object',
              'required':
                [
                  'id',
                  'title',
                  'description',
                  'icon',
                  'color',
                  'system',
                  'keyHint',
                  'owner',
                  'roles',
                  'levels',
                  'fields',
                  'resources',
                ],
              'properties':
                {
                  'id': { 'type': 'string' },
                  'title': { 'type': 'string' },
                  'description': { 'type': 'string' },
                  'icon': { 'type': 'string' },
                  'color': { 'type': 'string' },
                  'system': { 'type': 'string' },
                  'keyHint': { 'type': 'string' },
                  'owner': { 'type': 'string' },
                  'roles':
                    {
                      'type': 'array',
                      'items': { 'type': 'string', 'enum': ['analyst', 'backend', 'tester', 'designer'] },
                    },
                  'levels': { 'type': 'array', 'items': { 'type': 'string', 'enum': ['read', 'write', 'admin'] } },
                  'fields': { 'type': 'array', 'items': { '$ref': '#/components/schemas/Field' } },
                  'resources': { 'type': 'array', 'items': { '$ref': '#/components/schemas/Resource' } },
                },
            },
          'Catalog':
            {
              'type': 'object',
              'required': ['version', 'context', 'templates'],
              'properties':
                {
                  'version': { 'type': 'integer', 'enum': [1] },
                  'context':
                    {
                      'type': 'object',
                      'required': ['profile_id', 'product_id', 'job_role', 'name', 'team_name', 'can_review'],
                      'properties':
                        {
                          'profile_id': { 'type': 'string' },
                          'product_id': { 'type': 'string' },
                          'job_role': { 'type': 'string' },
                          'name': { 'type': 'string' },
                          'team_name': { 'type': 'string' },
                          'can_review': { 'type': 'boolean', 'enum': [false] },
                        },
                    },
                  'templates': { 'type': 'array', 'items': { '$ref': '#/components/schemas/Template' } },
                },
            },
        },
    },
}
