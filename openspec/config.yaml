schema: spec-driven
context: |
  Пиши документы на русском; сохраняй служебные заголовки OpenSpec на английском.
  Для implement-python-agent авторизован первый Python-срез: каркас Flask, read-only MCP-клиент и тесты.
  Полный агент и Go/UI интеграция остаются последующими задачами; Go и фронтенд не менять.
  Go владеет идентичностью, правами, диалогами и бизнес-операциями.
  Python + Flask управляет LLM и является MCP-клиентом.
  Используй синтетические данные; не выдавай их за регламенты Авито.
rules:
  proposal:
    - Отделяй предложенное поведение от фактически реализованного.
  specs:
    - Используй MUST и стабильные идентификаторы требований и сценариев.
    - Описывай наблюдаемые результаты, отказы, ошибки и отсутствие побочных действий.
  design:
    - Не меняй публичный contracts/openapi.yaml в задаче документов; явно опиши необходимые изменения и совместимость до реализации.
  tasks:
    - Включай проверку результата и документацию в каждый этап реализации.
    - Не отмечай реализацию выполненной на основании наличия спецификации.
