services:
  web:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q"]
    ports: !override
      - "0.0.0.0:80:80"
    volumes:
      - ./.deploy/web.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.deploy/auth-map.conf:/etc/nginx/conf.d/00-auth-map.conf:ro
      - ./.deploy/auth.conf:/etc/nginx/buddy-auth.conf:ro
      - ./.deploy/htpasswd:/etc/nginx/buddy.htpasswd:ro
  hr-web:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q"]
    ports: !override
      - "0.0.0.0:5181-5191:5181-5191"
    volumes:
      - ./.deploy/hr-web.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.deploy/auth-map.conf:/etc/nginx/conf.d/00-auth-map.conf:ro
      - ./.deploy/auth.conf:/etc/nginx/buddy-auth.conf:ro
      - ./.deploy/htpasswd:/etc/nginx/buddy.htpasswd:ro
  go:
    restart: unless-stopped
    environment:
      JIRA_SESSION_SECRET: ${COMPOSE_JIRA_SESSION_SECRET:-${COMPOSE_SESSION_SECRET:-local-demo-session-change-for-shared-host}}
  agent:
    restart: unless-stopped
  mcp:
    restart: unless-stopped
  hr-absences:
    restart: unless-stopped
  hr-trips:
    restart: unless-stopped
  hr-hiring:
    restart: unless-stopped
  hr-offboarding:
    restart: unless-stopped
  hr-consents:
    restart: unless-stopped
  hr-benefits:
    restart: unless-stopped
  hr-documents:
    restart: unless-stopped
  hr-events:
    restart: unless-stopped

  confluence:
    restart: unless-stopped
    ports: !override []

  jira-db:
    restart: unless-stopped
    profiles: !override []
    environment:
      POSTGRES_PASSWORD: ${COMPOSE_JIRA_DB_PASSWORD:-${COMPOSE_DB_PASSWORD:-local-aibuddy-secret}}
  jira-migrate:
    profiles: !override []
    environment:
      PGPASSWORD: ${COMPOSE_JIRA_DB_PASSWORD:-${COMPOSE_DB_PASSWORD:-local-aibuddy-secret}}
  jira:
    restart: unless-stopped
    profiles: !override []
    environment:
      PGPASSWORD: ${COMPOSE_JIRA_DB_PASSWORD:-${COMPOSE_DB_PASSWORD:-local-aibuddy-secret}}
      JIRA_SESSION_SECRET: ${COMPOSE_JIRA_SESSION_SECRET:-${COMPOSE_SESSION_SECRET:-local-demo-session-change-for-shared-host}}
